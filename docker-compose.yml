services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grammar-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/model
      - MODEL_ID=dipak-bigdrops/grammar-correction-model
      # - HF_TOKEN=   # set if using a private Hugging Face repo
    volumes:
      - api-temp:/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - grammar-network
    restart: unless-stopped

volumes:
  api-temp:

networks:
  grammar-network:
    driver: bridge
